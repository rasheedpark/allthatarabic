<style>
  :root { --accent: #1D49FF; --text: #12205A; --sub: #6E7591; --bg: #F4F6FB; --border: #DDE2EE; }
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Spoqa Han Sans Neo', sans-serif; background: var(--bg); color: var(--text);
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .wrap { max-width: 480px; width: 100%; text-align: center; }
  .logo { width: 80px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .ver { font-size: 11px; color: var(--sub); letter-spacing: 1.5px; margin-bottom: 32px; text-transform: uppercase; }
  .apps { display: flex; flex-direction: column; gap: 12px; }
  .app-link { display: block; padding: 18px 20px; background: white; border: 1px solid var(--border);
              border-radius: 12px; text-decoration: none; color: var(--text); transition: all .15s; }
  .app-link:hover { border-color: var(--accent); transform: translateY(-1px); }
  .app-link strong { display: block; font-size: 16px; margin-bottom: 3px; }
  .app-link span { display: block; font-size: 12px; color: var(--sub); }
  .app-link .ver-tag { display: inline-block; font-size: 10px; color: var(--accent);
    background: rgba(29,73,255,0.08); border-radius: 4px; padding: 1px 6px;
    font-weight: 700; letter-spacing: .5px; margin-top: 4px; }
  .section-label { font-size: 11px; color: var(--sub); text-transform: uppercase;
    letter-spacing: 1.5px; margin: 20px 0 8px; text-align: left; }
  .app-link.review { border-color: #b8e0d0; background: #f5fcf9; }
  .app-link.review:hover { border-color: #138a5b; }
  .app-link.review .ver-tag { color: #138a5b; background: #e7f7f0; }
</style>
</head>
