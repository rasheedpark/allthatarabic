<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>올댓아라빅 1.4.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500;700&family=Noto+Kufi+Arabic:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans@latest/css/SpoqaHanSansNeo.css" rel="stylesheet">
<style>
@font-face {
  font-family: 'Dongol';
  src: url('../assets/fonts/Dongol-Regular.otf') format('opentype');
  font-weight: normal;
  font-style: normal;
}
/* ── 리셋 & 변수 ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:          #F2F4F6;
  --surface:     #FFFFFF;
  --accent:      #1D49FF;
  --text:        #12205A;
  --sub:         #888FAC;
  --border:      #D5DAE8;
  --accent-soft: rgba(29,73,255,0.08);
  --accent-wash: #EAF0FF;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Spoqa Han Sans Neo', 'Apple SD Gothic Neo', sans-serif;
  height: 100vh;
  position: relative;
}

/* ── 4 코너 ── */
#ui-tl, #ui-bl, #ui-br { position: fixed; z-index: 10; }
#ui-tl {
  top: clamp(1rem,3vw,2rem); left: clamp(1rem,3vw,3rem);
  font-size: clamp(0.8rem,1.8vw,1.3rem);
  font-weight: bold; color: var(--text);
  line-height: 1.4; max-width: 75vw;
}
#ui-tr {
  font-size: clamp(0.55rem,0.85vw,0.75rem);
  text-transform: uppercase;
  letter-spacing: 2.5px;
  color: var(--sub);
  opacity: 0.65;
  white-space: nowrap;
  margin-bottom: 0.5rem;
}
#ui-bl {
  bottom: clamp(1rem,3vw,2rem); left: clamp(1rem,3vw,3rem);
  font-size: clamp(0.65rem,1.2vw,1rem);
  color: var(--sub);
}
#ui-br {
  bottom: clamp(1rem,3vw,2rem); right: clamp(1rem,3vw,3rem);
}
#ui-br img {
  width: clamp(60px, 7vw, 110px);
  opacity: 0.85;
  display: block;
}

/* ── 진행바 ── */
#progress {
  position: fixed; top: 0; left: 0;
  height: 3px; background: var(--accent);
  transition: width 0.3s; z-index: 50;
}

/* ── 메인 콘텐츠 ── */
#main {
  position: fixed;
  top: 0; bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(92vw, 1400px);
  container-type: inline-size;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(1rem, 3vh, 2.5rem);
  padding: clamp(60px,10vh,100px) clamp(1rem,4vw,3rem) clamp(80px,12vh,120px);
  touch-action: pan-y;
}

/* ── baseline 모드: CSS Grid 정렬 ── */
.bl-wrap { position:relative; width:100%; }
.bl-wrap.no-line .bl-line { display:none; }  /* css='baseline2' — 기준선 미표시 */
.bl-line {
  position:absolute; left:0; right:0; height:1.5px;
  background:rgba(29,73,255,0.3); pointer-events:none; z-index:0;
}
.bl-grid {
  display:grid;
  grid-template-columns:repeat(var(--items,5), 1fr);
  direction:rtl;
  width:100%;
  column-gap:clamp(6px,3vw,28px);
  row-gap:clamp(28px,3vw,48px);
}
.bl-letter {
  text-align:center;
  font-family:'Noto Sans Arabic',serif;
  font-size:clamp(3rem,calc(56vw/var(--items,4)),9rem);
  font-weight:700; line-height:1; color:var(--text);
}
.bl-label {
  text-align:center;
  font-size:clamp(0.6rem,1.2vw,1rem); font-weight:500;
  color:var(--sub); letter-spacing:0.3px;
}

/* ── 아랍어 ── */
.arabic {
  font-family: 'Noto Sans Arabic', serif;
  font-size: clamp(4rem, 16cqi, 18rem);  /* P 유닛: 컨테이너 기준, 짧은 단어 */
  font-weight: 700;
  direction: rtl;
  line-height: 1.6;
  text-align: center;
}
.arabic.arabic-a {
  font-size: clamp(2.5rem, 9cqi, 10rem); /* A 유닛: 문장형, 한 줄에 맞춤 */
}
.arabic.arabic-sentence {
  font-size: clamp(2rem, 7cqi, 8rem);
}
/* A 유닛 드릴: 문장 길이 무관 일정 크기 — fitArabicText 호출 안 함 */
.arabic.arabic-a.arabic-drill {
  font-size: clamp(1.8rem, 5.5cqi, 4.5rem);
  word-break: keep-all;
  white-space: normal;
  line-height: 1.7;
}
.arabic.arabic-a.arabic-drill-rep {
  font-size: clamp(1.8rem, 5cqi, 4rem);
  word-break: keep-all;
  white-space: normal;
  line-height: 1.5;
}

/* 래퍼토리 그리드 (| 구분 다중 항목) */
.rep-grid {
  display: grid;
  direction: rtl;
  column-gap: clamp(8px, 3vw, 32px);
  row-gap: clamp(6px, 1.5vw, 18px);
  width: 100%;
  justify-items: center;
}
.rep-grid-ar {
  font-family: 'Noto Sans Arabic', serif;
  font-size: clamp(1.8rem, 5cqi, 4rem);
  font-weight: 700;
  direction: rtl;
  text-align: center;
  line-height: 1.5;
  color: var(--text);
}
.rep-grid-ko {
  font-size: clamp(0.9rem, 2.2vw, 2rem);
  text-align: center;
  color: var(--text);
  line-height: 1.4;
  direction: ltr;
}
.rep-grid-note {
  font-size: clamp(0.7rem, 1.6vw, 1.4rem);
  text-align: center;
  color: var(--sub);
  line-height: 1.3;
  direction: ltr;
}
/* 멀티행 래퍼토리: 아랍어 행이 2개 이상일 때 폰트 축소 */
.rep-grid--multirow .rep-grid-ar {
  font-size: clamp(1.4rem, 3.8cqi, 3rem);
}
.rep-grid--multirow .rep-grid-ko {
  font-size: clamp(0.8rem, 1.8vw, 1.6rem);
}
.rep-grid--multirow .rep-grid-note {
  font-size: clamp(0.6rem, 1.2vw, 1.1rem);
}

/* ── 한국어/노트 ── */
.korean {
  display: block;
  font-size: clamp(1.8rem, 4.5vw, 5rem);
  transition: opacity 0.3s;
  line-height: 1.4;
}
.note {
  display: block;
  font-size: clamp(0.72rem, 1.8vw, 2rem);
  color: var(--sub);
  text-align: center;
  transition: opacity 0.3s;
  line-height: 1.4;
  margin-top: 0.4em;
}

/* ── write 모드 ── */
.write-pair-row {
  display: flex; flex-direction: row-reverse;
  align-items: baseline;
  gap: clamp(4px, calc(12cqi / var(--items, 4)), 20px);
}
.write-pair {
  display: flex; flex-direction: column;
  align-items: center;
  gap: clamp(10px, 2.5vw, 24px);
}
.write-arabic-letter {
  font-family: 'Dongol', 'Noto Kufi Arabic', serif;
  font-weight: 400;
  font-size: clamp(3.5rem, calc(90cqi / var(--items, 3)), 10rem);
  color: var(--text);
  line-height: 1;
}
.write-token {
  display: inline-block;
  vertical-align: baseline;
  clip-path: inset(-40% 0% -40% 100%);
}
.write-pair-label {
  font-size: clamp(0.6rem, 1.2vw, 0.85rem);
  font-weight: 500;
  color: var(--sub);
  text-align: center;
  white-space: nowrap;
  letter-spacing: 0.02em;
}

/* ── sentence 모드 ── */
.sentence-ar {
  font-family: 'Noto Sans Arabic', serif;
  font-size: clamp(4rem, 16cqi, 18rem);  /* P 유닛 */
  font-weight: 700;
  text-align: center;
  direction: rtl;
  line-height: 1.55;
  color: var(--text);
}
.sentence-ar.sentence-a {
  font-size: clamp(2.5rem, 9cqi, 10rem); /* A 유닛 */
}
.sentence-kr {
  font-size: clamp(1.8rem, 4.5vw, 5rem);
  color: var(--sub);
  text-align: center;
  line-height: 1.4;
}

/* ── svo 모드 ── */
.svo-row {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: clamp(10px, 2.5vw, 28px);
  direction: ltr;
  unicode-bidi: isolate;
}
.svo-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.svo-cell .svo-ar {
  font-family: 'Noto Sans Arabic', serif;
  font-size: clamp(1.6rem, 4vw, 3rem);
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
  direction: rtl;
  unicode-bidi: isolate;
}
.svo-cell .svo-lbl {
  font-size: clamp(0.65rem, 1.2vw, 0.85rem);
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.svo-translation {
  font-size: clamp(1.8rem, 4.5vw, 5rem);
  color: var(--sub);
  text-align: center;
  margin-top: 0.5rem;
}

/* ── 나스 슬라이드 ── */
.nass-korean-hint {
  font-size: clamp(1.3rem, 3vw, 3.5rem);
  color: var(--sub);
  opacity: 0.85;
  text-align: center;
  margin-top: 0.5rem;
}
.nass-prompt {
  display: flex; flex-direction: column;
  align-items: center; gap: 0.8rem;
  min-height: 4rem;
}
.nass-sual {
  font-family: 'Noto Kufi Arabic', 'Noto Sans Arabic', serif;
  font-size: clamp(1.1rem, 2.5vw, 2.2rem);
  font-weight: 400;
  color: var(--sub);
  direction: rtl;
  text-align: center;
}
.nass-arabic-wrap {
  max-height: 55vh; overflow-y: auto;
  width: 100%; padding: 0 clamp(1rem,5vw,4rem);
}
.nass-arabic-wrap .arabic {
  font-family: 'Noto Sans Arabic', serif;
  font-size: clamp(1.2rem, 3.2vw, 3.8rem);
  text-align: center;
  direction: rtl;
  line-height: 2;
}
.nass-sual-note {
  font-family: 'Noto Kufi Arabic', 'Noto Sans Arabic', serif;
  font-size: clamp(0.75rem, 1.5vw, 1.3rem);
  color: var(--sub);
  direction: rtl;
  text-align: center;
  margin-top: 0.3em;
  opacity: 0.8;
}
.nass-note {
  font-size: clamp(0.85rem, 1.2vw, 1.4rem);
  color: var(--sub);
  text-align: center;
  line-height: 1.6;
  opacity: 0.85;
}

/* ── 하이라이트 ── */
.highlight-box {
  border: 3px solid var(--accent);
  background: rgba(29,73,255,0.08);
  border-radius: 14px;
  padding: 0.3em 0.45em 0.25em;
  margin: 0 0.2em;
  display: inline-block;
  vertical-align: middle;
  min-width: 1.4em;
  text-align: center;
  line-height: 1.3;
}
.highlight-text { color: var(--accent); font-weight: bold; }

/* 명사문(nominal) 구분자 — css = 'nom' 행의 `|` */
.nom-divider {
  display: inline-block;
  color: var(--sub);
  opacity: 0.4;
  font-size: 0.55em;
  font-weight: 200;
  margin: 0 0.5em;
  vertical-align: 0.2em;
  user-select: none;
}

/* ── 설명 블록 (summary desc) ── */
.sum-body {
  display: flex; flex-direction: column;
  gap: 8px;
  max-width: 640px;
  width: 100%;
  align-self: center;
  text-align: left;
  direction: ltr;
}
.sum-prose {
  font-size: clamp(0.85rem, 1.8vw, 1.05rem);
  line-height: 1.85;
  color: var(--sub);
  white-space: pre-line;
}
.sum-bullet {
  display: flex; gap: 8px; align-items: flex-start;
  font-size: clamp(0.82rem, 1.6vw, 1rem);
  line-height: 1.7; color: var(--text);
}
.sum-bullet-dot { color: var(--accent); font-size: 15px; flex-shrink: 0; margin-top: 2px; }

/* ── 사이드바 ── */
#sidebar {
  position: fixed; top: 0; left: 0;
  width: min(440px, 92vw); height: 100%;
  background: rgba(245,247,252,0.98);
  border-right: 2px solid var(--accent);
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  z-index: 200;
  display: flex; flex-direction: column;
  box-shadow: 5px 0 30px rgba(29,73,255,0.12);
}
#sidebar.open { transform: translateX(0); }
.sb-head {
  padding: 1.2rem 1.8rem 1rem;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-head h2 {
  color: var(--accent);
  font-size: clamp(0.85rem,1.6vw,1.1rem);
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 0.9rem;
}
.key-list { list-style: none; }
.key-row {
  display: flex; align-items: center; gap: 10px;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  font-size: clamp(0.62rem,1.1vw,0.8rem);
  color: var(--sub);
}
.key-row:last-child { border-bottom: none; }
.key-row .key-desc { flex: 1; }
.key {
  display: inline-flex; align-items: center; justify-content: center;
  background: #fff; border: 1.5px solid var(--border);
  padding: 1px 7px; border-radius: 5px;
  font-weight: 700; color: var(--text);
  font-size: 0.85em; white-space: nowrap;
  box-shadow: 0 1px 3px rgba(29,73,255,0.08);
  min-width: 1.8em;
}
#index-list {
  list-style: none; overflow-y: auto; flex: 1; padding: 0.4rem 0;
}
.idx-item {
  padding: 0.6rem 1.6rem;
  font-size: clamp(0.72rem,1.5vw,1rem);
  color: var(--sub); cursor: pointer;
  border-left: 4px solid transparent;
  transition: all 0.15s;
  display: flex; gap: 0.7rem; align-items: center;
}
.idx-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.idx-item:hover { background: rgba(29,73,255,0.06); color: var(--text); }
.idx-item.active { background: rgba(29,73,255,0.1); color: var(--text); border-left-color: var(--accent); }
.idx-tag {
  font-size: 0.7em; color: var(--accent);
  background: rgba(29,73,255,0.1);
  padding: 1px 6px; border-radius: 4px;
  flex-shrink: 0; text-transform: uppercase;
  font-weight: 700;
}
.idx-ko { font-size: 0.78em; color: var(--sub); display: block; margin-top: 1px; direction: ltr; text-align: left; }
.idx-ar { font-family: 'Noto Sans Arabic', serif; direction: rtl; text-align: left; }

/* ── 섹션 탭 ── */
#section-tabs {
  display: flex; gap: 0.4rem; flex-wrap: nowrap; align-items: center;
}
.sec-tab {
  background: #fff; border: 1.5px solid var(--border); border-radius: 6px;
  color: var(--sub); cursor: pointer; font-family: inherit;
  font-size: clamp(0.5rem, 0.85vw, 0.68rem); line-height: 1.3;
  padding: 2px 9px; text-align: center; transition: all 0.15s; white-space: nowrap;
}
.sec-tab small { display: block; font-size: 0.85em; opacity: 0.7; }
.sec-tab:hover { border-color: var(--accent); color: var(--accent); }
.sec-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: bold; }
.sec-tab.disabled { opacity: 0.25; cursor: default; pointer-events: none; }

/* ── 하단 단축키 바 ── */
#toolbar {
  position: fixed;
  bottom: clamp(0.8rem,2vw,1.5rem);
  left: 50%; transform: translateX(-50%);
  display: flex; gap: clamp(0.7rem,1.8vw,1.5rem);
  z-index: 30; align-items: center;
  background: rgba(255,255,255,0.85);
  border: 1px solid var(--border);
  border-radius: 30px;
  padding: 5px 18px;
  backdrop-filter: blur(8px);
  box-shadow: 0 2px 12px rgba(29,73,255,0.08);
}
.tb-btn {
  background: transparent; border: none;
  color: var(--sub); cursor: pointer;
  font-size: clamp(0.55rem,0.82vw,0.72rem);
  font-family: inherit;
  display: flex; align-items: center; gap: 4px;
  opacity: 0.7; transition: opacity 0.15s, color 0.15s;
  padding: 2px 0;
  white-space: nowrap;
}
.tb-btn:hover { opacity: 1; color: var(--accent); }
.tb-btn.active { opacity: 1; color: var(--accent); }
.tb-btn .kb {
  display: inline-flex; align-items: center; justify-content: center;
  background: #fff; border: 1.5px solid var(--border);
  border-radius: 4px; padding: 0px 5px;
  font-size: 0.88em; color: var(--text); font-weight: 700;
  min-width: 1.6em;
  box-shadow: 0 1px 2px rgba(29,73,255,0.07);
}

/* ── 로딩 ── */
#loading {
  position: fixed; inset: 0;
  background: var(--accent);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 1.4rem;
  z-index: 999;
}
#loading img {
  width: clamp(80px, 12vw, 140px);
  filter: brightness(0) invert(1);
}
#loading .loading-label {
  font-size: clamp(0.7rem, 1.2vw, 0.95rem);
  color: rgba(255,255,255,0.75);
  letter-spacing: 2.5px;
  text-transform: lowercase;
  font-weight: 400;
}

/* ── 모바일 대응 ── */
@media (max-width: 600px) {
  #ui-tl { max-width: 60vw; }
  #ui-bl { display: none; }
}
</style>
</head>
<body>

<div id="loading">
  <img src="../assets/ata-logo2.png" alt="All That Arabic">
  <div class="loading-label">markazarabic 1.4.3</div>
</div>

<div id="progress"></div>

<!-- 코너 -->
<div id="ui-tl"></div>
<div id="ui-bl">© Markaz Arabic</div>
<div id="ui-br"><img src="../assets/ata-logo2.png" alt="All That Arabic"></div>

<!-- 사이드바 -->
<div id="sidebar">
  <div class="sb-head">
    <h2>All That Arabic 1.4.3</h2>
    <ul class="key-list">
      <li class="key-row"><span class="key">M</span><span class="key-desc">메뉴 열기/닫기</span></li>
      <li class="key-row"><span class="key">Space</span><span class="key-desc">해석 보기/가리기</span></li>
      <li class="key-row"><span class="key">A</span><span class="key-desc">본문 보기/가리기</span></li>
      <li class="key-row"><span class="key">T</span><span class="key-desc">지문 보기/가리기 (나스)</span></li>
      <li class="key-row"><span class="key">S</span><span class="key-desc">오디오 재생/정지</span></li>
      <li class="key-row"><span class="key">← →</span><span class="key-desc">이전 / 다음 슬라이드</span></li>
      <li class="key-row"><span class="key">Home</span><span class="key">End</span><span class="key-desc">처음 / 마지막</span></li>
    </ul>
  </div>
  <ul id="index-list"></ul>
</div>

<!-- 메인 -->
<div id="main">
  <div id="ui-tr">SUMMARY</div>
  <div id="arabic-area"></div>
  <div id="text-area"></div>
</div>

<!-- 단축키 바 -->
<div id="toolbar">
  <button class="tb-btn" id="btn-menu"><span class="kb">M</span> 메뉴</button>
  <button class="tb-btn" id="btn-audio"><span class="kb">S</span> 오디오</button>
  <button class="tb-btn" id="btn-meaning"><span class="kb">Space</span> 해석</button>
  <button class="tb-btn" id="btn-arabic"><span class="kb">A</span> 본문</button>
  <button class="tb-btn" id="btn-nass" style="display:none"><span class="kb">T</span> 지문</button>
</div>

<audio id="slide-audio"></audio>

<script>
// ── 설정 ──────────────────────────────────────────────
const SHEET_ID   = '16lEfx8CSJsU5EuDmF-9xlP9E_SGPa6TTcNhEeBg9ycg';
const AUDIO_BASE = 'https://storage.googleapis.com/all-that-arabic-14';
const AUDIO_FOLDER = 'listening';
const AUDIO_EXTS = ['.mp3', '.wav'];
const TAB_DS     = 'datasheet';
const GID_NASS   = '847423907';

const TYPE_EN = { summary:'SUMMARY', pattern:'PATTERN', drill:'DRILL', exp:'EXPRESSION', nass:'NASS', repertorie:'REPERTOIRE', repertory:'REPERTOIRE' };

// 라하 깃발 매핑 — 1.4.4와 동일
const LAHJA_FLAG = {
  EGY: '../assets/icons/icon-egypt.png',
  LEV: '../assets/icons/icon-lebanon.png',
  GLF: '../assets/icons/icon-saudi.png',
};

// 라하 블록 HTML — 멀티 라하 지원 ("GLF, LEV" → 두 개 표시)
function lahjaBlockHtmlFor(s) {
  const flagSrcs = (s?.data?.lahja || '').toUpperCase().split(/[,\s]+/).map(t => t.trim()).filter(Boolean)
    .map(l => LAHJA_FLAG[l]).filter(Boolean);
  return flagSrcs.length
    ? `<div class="lahja-block" style="margin-top:0.6rem; display:flex; justify-content:center; gap:0.4rem;">${
        flagSrcs.map(src => `<img src="${src}" style="width:clamp(22px,1.8vw,32px); height:clamp(22px,1.8vw,32px); border-radius:50%; opacity:0.92;">`).join('')
      }</div>`
    : '';
}
function appendLahjaBlock(s) {
  const html = lahjaBlockHtmlFor(s);
  if (html) document.getElementById('text-area').insertAdjacentHTML('beforeend', html);
}

// ── 상태 ──────────────────────────────────────────────
let slides = [], current = 0;
let meaningVisible  = true;
let arabicVisible   = true;
let nassTextVisible = false;
let sidebarOpen     = false;
let _firstLoad      = true;
let audioPlaying    = false;
let currentPg       = null;

// ── 유틸 ──────────────────────────────────────────────
function normalizeType(t) {
  const s = (t || '').toLowerCase().trim();
  if (s === 'summary')                          return 'summary';
  if (s === 'pattern(a)' || s === 'pattern(p)' || s === 'pattern') return 'pattern';
  if (s === 'drill')                            return 'drill';
  if (s === 'exp' || s === 'expression')        return 'exp';
  if (s === 'nass')                             return 'nass';
  if (s === 'writing')                          return 'writing';
  if (s === 'repertorie' || s === 'repertory')  return 'repertorie';
  return s;
}
// ── i열 기반 유닛 맵 (초기화 후 사용) ────────────────
// i값 등장 순서 → P01~P10, A01~A25 순서로 매핑
let _iUnitMap = {};
function buildUnitMaps(dsRaw) {
  const ALL_UNITS = [
    'P01','P02','P03','P04','P05','P06','P07','P08','P09','P10',
    'A01','A02','A03','A04','A05','A06','A07','A08','A09','A10',
    'A11','A12','A13','A14','A15','A16','A17','A18','A19','A20',
    'A21','A22','A23','A24','A25'
  ];
  _iUnitMap = {};
  let idx = 0;
  dsRaw.forEach(r => {
    if (!r.i || _iUnitMap.hasOwnProperty(r.i)) return;
    _iUnitMap[r.i] = ALL_UNITS[idx++] || '';
  });
}

// u열이 비어있는 경우 id_datasheet / id_nass / i열에서 유닛 추출
function getRowU(r) {
  if (r?.u) return r.u;
  const id = r?.id_datasheet || r?.id_nass || r?.id || '';
  if (id && id !== '#REF!') return id.split('-')[0] || '';
  // i열로 유닛 추론 (등장 순서 기반)
  if (r?.i && _iUnitMap.hasOwnProperty(r.i)) return _iUnitMap[r.i] || '';
  return '';
}
function getRowId(r) { return r?.id_datasheet || r?.id_nass || r?.id || ''; }
function getBaseUnit(u) { return (u || '').replace(/[a-z]+$/, ''); }

// JSONP로 u열/id_datasheet가 비어있을 때 순서 기반으로 유닛 할당
const DS_UNIT_SEQ = [
  'P01','P02','P03','P04','P05','P06','P07','P08','P09','P10',
  'A01','A02','A03','A04','A05','A06','A07','A08','A09','A10',
  'A11','A12','A13','A14','A15','A16','A17','A18','A19','A20',
  'A21','A22','A23','A24','A25'
];
function annotateUnits(rows) {
  let seqIdx = -1, curUnit = '', prevType = '';
  return rows.map(r => {
    if (r.u) { prevType = normalizeType(r.type); return r; }
    // id_datasheet에서 유닛 추출 가능하면 사용
    const fromId = getRowU(r);
    if (fromId && fromId !== '#REF!') {
      curUnit = getBaseUnit(fromId);
      prevType = normalizeType(r.type);
      return { ...r, u: curUnit };
    }
    const t = normalizeType(r.type);
    // non-summary → summary 전환 시에만 다음 유닛으로
    if (t === 'summary' && prevType !== 'summary') {
      seqIdx++;
      curUnit = DS_UNIT_SEQ[seqIdx] || '';
    }
    prevType = t;
    return curUnit ? { ...r, u: curUnit } : r;
  });
}

function isAudioSlide(s) {
  return ['drill','exp','nass'].includes(s.type) && !!(s.data?.url || getRowId(s.data));
}

// ── JSONP 로더 ──────────────────────────────────────
const _cache = {};
function fetchSheet(nameOrGid, isGid = false) {
  const key = isGid ? 'gid:' + nameOrGid : nameOrGid;
  if (_cache[key]) return Promise.resolve(_cache[key]);
  return new Promise((resolve, reject) => {
    const cb = '__gviz_' + key.replace(/\W/g, '') + '_' + Date.now();
    const timer = setTimeout(() => { delete window[cb]; reject(new Error('Timeout: ' + key)); }, 30000);
    window[cb] = resp => {
      clearTimeout(timer);
      delete window[cb];
      if (script.parentNode) script.parentNode.removeChild(script);
      try {
        if (!resp?.table) throw new Error('No data: ' + key);
        // c.id는 컬럼 레터(A,B,C...)라 label 없는 컬럼에 쓰면 헤더명 충돌 발생 → label만 사용
        const headers = resp.table.cols.map(c => (c.label || '').toLowerCase().trim());
        const rows = (resp.table.rows || []).map(row => {
          const obj = {};
          headers.forEach((h, i) => {
            if (!h) return;
            const cell = row.c?.[i];
            // v가 null일 때 f(formatted)를 fallback으로 사용 — JSONP에서 문자열이 v:null/f:"P01"로 올 수 있음
            const val = (cell && cell.v != null)
              ? (cell.f != null && (typeof cell.v === 'number' || String(cell.v).startsWith('Date('))
                  ? cell.f : cell.v)
              : (cell?.f != null ? cell.f : null);
            obj[h] = val != null ? String(val).trim() : '';
          });
          return obj;
        }).filter(r => Object.values(r).some(v => v !== ''));
        _cache[key] = rows;
        resolve(rows);
      } catch(e) { reject(e); }
    };
    const script = document.createElement('script');
    const param = isGid ? `gid=${nameOrGid}` : `sheet=${encodeURIComponent(nameOrGid)}`;
    const rangeParam = isGid ? '' : '&range=A:AD'; // B열(u) 값을 제대로 읽기 위해 range 명시
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&${param}&headers=1${rangeParam}`;
    script.onerror = () => { clearTimeout(timer); delete window[cb]; reject(new Error('Load fail: ' + key)); };
    document.head.appendChild(script);
  });
}

function fetchOptionalSheet(nameOrGid, isGid = false) {
  return fetchSheet(nameOrGid, isGid).catch(err => {
    console.warn(err);
    const key = isGid ? 'gid:' + nameOrGid : nameOrGid;
    _cache[key] = [];
    return [];
  });
}

// ── parseText ──────────────────────────────────────────
function parseText(str) {
  if (!str) return '';
  return str
    .replace(/<br\s*\/?>/gi, '<br>')
    .replace(/\n|\r\n|\r/g, '<br>')
    .replace(/_([^_\n]+)_/g, '<span class="highlight-box">$1</span>')
    .replace(/\*([^*\n]+)\*/g, '<span class="highlight-text">$1</span>');
}

// 명사문 구분자 — `css = 'nom'` 행의 `|`를 옅은 회색 분리자로
function applyNomDivider(html) {
  return html.replace(/\s*\|\s*/g, '<span class="nom-divider">|</span>');
}
const isNomRow = r => (r?.css || '').trim().toLowerCase() === 'nom';
const hasSlideContent = r => [r?.arabic, r?.korean, r?.note]
  .some(v => String(v || '').trim());

// ── buildSlides ────────────────────────────────────────
async function buildSlides(baseUnit) {
  slides = []; currentPg = baseUnit;
  nassTextVisible = false;

  const sp = new URLSearchParams(location.search);
  sp.set('unit', baseUnit);
  history.replaceState(null, '', '?' + sp.toString());

  const [dsRaw, nassRaw] = await Promise.all([
    fetchSheet(TAB_DS),
    fetchOptionalSheet(GID_NASS, true),
  ]);

  const escaped = baseUnit.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const subReg  = new RegExp('^' + escaped + '[a-z]?$', 'i');

  // 써머리 제외 — 패턴·래퍼토리·드릴만 시트 순서 그대로
  const dsRows = dsRaw.filter(r => {
    const t = normalizeType(r.type);
    if (!['pattern','repertorie','drill','exp'].includes(t)) return false;
    if (!hasSlideContent(r)) return false;
    if (!subReg.test(getRowU(r))) return false;
    const s = (r.status || '').toLowerCase();
    return s === '' || s === 'confirmed';
  });

  // Some 1.4.3 rows were inserted as repertorie -> pattern -> drill.
  // Keep normal sheet order, but lift a pattern above the immediately preceding
  // repertorie block when those reps belong to the same later pattern group.
  const orderedDsRows = [];
  dsRows.forEach(r => {
    if (normalizeType(r.type) === 'pattern') {
      const reps = [];
      while (orderedDsRows.length && normalizeType(orderedDsRows[orderedDsRows.length - 1].type) === 'repertorie') {
        reps.unshift(orderedDsRows.pop());
      }
      const beforeReps = orderedDsRows[orderedDsRows.length - 1];
      const repsAlreadyFollowPattern = beforeReps && normalizeType(beforeReps.type) === 'pattern';
      if (repsAlreadyFollowPattern) orderedDsRows.push(...reps, r);
      else orderedDsRows.push(r, ...reps);
    } else {
      orderedDsRows.push(r);
    }
  });

  orderedDsRows.forEach(r =>
    slides.push({ type: normalizeType(r.type), data: r, pg: baseUnit })
  );

  // 나스 슬라이드 — id_nass에서 유닛 추출 (u열 비어있음)
  nassRaw
    .filter(r => {
      if (normalizeType(r.type) !== 'nass') return false;
      if (!hasSlideContent(r)) return false;
      const s = (r.status || '').toLowerCase();
      if (s !== '' && s !== 'confirmed') return false;
      const nassU = (r.id_nass || '').split('-')[0];
      return nassU.toUpperCase() === baseUnit.toUpperCase();
    })
    .sort((a, b) => getRowId(a).localeCompare(getRowId(b)))
    .forEach(r => slides.push({ type: 'nass', data: r, pg: baseUnit }));

  if (_firstLoad) {
    const saved = parseInt(new URLSearchParams(location.search).get('slide')) || 0;
    current = Math.max(0, Math.min(slides.length - 1, saved));
    _firstLoad = false;
  } else {
    current = 0;
  }

  buildIndex();
  renderSlide();
}

// ── renderSlide ────────────────────────────────────────
function renderSlide() {
  if (!slides.length) return;
  const s = slides[current];

  // 진행바
  document.getElementById('progress').style.width = ((current + 1) / slides.length * 100) + '%';

  // ui-tr: 타입 레이블
  const origType = (s.data?.type || '').toLowerCase().trim();
  const typeLabel = origType.startsWith('pattern') ? 'PATTERN' : (TYPE_EN[s.type] || TYPE_EN[origType] || s.type.toUpperCase());
  const nassNum = s.type === 'nass'
    ? (() => { const m = getRowId(s.data).match(/(\d+)$/); return m ? ' · nass-' + m[1] : ''; })()
    : '';
  document.getElementById('ui-tr').innerHTML = typeLabel + nassNum;

  // ui-tl: 유닛 정보 + 섹션 탭
  const tl = document.getElementById('ui-tl');
  const curPgU = s.pg || '';
  const dsRaw = _cache[TAB_DS] || [];
  const unitRow = dsRaw.find(r => {
    const nt = normalizeType(r.type);
    return (nt === 'summary' || nt === 'pattern') && getBaseUnit(getRowU(r)) === curPgU;
  });
  const tlArabic = (unitRow?.arabic || '').substring(0, 30);
  const tlKorean = (unitRow?.korean || '').substring(0, 28);
  tl.innerHTML =
    `<div style="display:flex;align-items:center;gap:1.4rem;">` +
      `<div>` +
        `<div style="font-size:clamp(0.45rem,0.7vw,0.6rem);text-transform:uppercase;letter-spacing:2px;color:var(--sub);opacity:0.6;margin-bottom:0.2rem;">${curPgU}</div>` +
        `<div style="font-family:'Noto Sans Arabic',serif;direction:rtl;font-size:clamp(0.9rem,1.8vw,1.4rem);font-weight:700;line-height:1.3;">${tlArabic}</div>` +
        `<div style="font-size:clamp(0.6rem,1vw,0.85rem);color:var(--sub);font-weight:400;">${tlKorean}</div>` +
      `</div>` +
      `<div id="section-tabs"></div>` +
    `</div>`;
  buildSectionTabs();

  // 나스 지문 버튼
  document.getElementById('btn-nass').style.display = s.type === 'nass' ? 'flex' : 'none';
  // 오디오 버튼 — 항상 표시, 오디오 없으면 흐리게
  const hasAudio = isAudioSlide(s);
  const audioBtn = document.getElementById('btn-audio');
  audioBtn.style.display = '';
  audioBtn.style.opacity = hasAudio ? '1' : '0.3';
  audioBtn.disabled = !hasAudio;

  // 렌더 분기 (early-return 없이 함수 선택만 — 끝에서 라하 깃발 append)
  const d = s.data;
  const cssMode = (d.css || '').trim().toLowerCase();

  if (s.type === 'nass') {
    renderNass(s);
  } else if (cssMode === 'baseline' || cssMode === 'baseline2') {
    renderBaseline(s, { noLine: cssMode === 'baseline2' });
  } else if (cssMode === 'write') {
    renderWrite(s);
  } else if (cssMode === 'dongol') {
    renderDongol(s);
  } else if (cssMode === 'sentence' || cssMode === 'nom') {
    renderSentence(s);
  } else if (cssMode === 'svo') {
    renderSvo(s);
  } else if (s.type === 'repertorie' && (s.data.arabic || '').includes('|')) {
    renderRepertoryGrid(s);
  } else {
    renderNormal(s);
  }

  appendLahjaBlock(s);  // 라하 깃발 — 1.4.4와 동일 (음가 밑)
  updateIndex();
}

// ── renderBaseline ─────────────────────────────────────
function renderBaseline(s, opts = {}) {
  const noLine = !!opts.noLine;  // css='baseline2'면 가로 기준선 미표시
  const d = s.data;
  const tokens = (d.arabic || '').trim().split(/\s+/).filter(t => t && t !== '|');
  const labelSrc = (d.korean || '').trim() || (d.note || '').trim();
  const labels = labelSrc
    ? labelSrc.split(/\s+/).filter(t => t !== '|').map(l => l.replace(/_/g, ' '))
    : [];
  const arOp = arabicVisible ? '1' : '0';

  const arabicArea = document.getElementById('arabic-area');
  arabicArea.innerHTML = '';
  arabicArea.style.cssText = `opacity:${arOp};transition:opacity 0.3s;`;

  const wrap = document.createElement('div');
  wrap.className = 'bl-wrap' + (noLine ? ' no-line' : '');

  const line = noLine ? null : document.createElement('div');
  if (line) {
    line.className = 'bl-line';
    wrap.appendChild(line);
  }

  const grid = document.createElement('div');
  grid.className = 'bl-grid';
  grid.style.setProperty('--items', tokens.length || 4);

  let firstLetter = null;
  tokens.forEach(ch => {
    const letter = document.createElement('span');
    letter.className = 'bl-letter';
    letter.innerHTML = parseText(ch);
    grid.appendChild(letter);
    if (!firstLetter) firstLetter = letter;
  });
  tokens.forEach((ch, i) => {
    const lbl = document.createElement('span');
    lbl.className = 'bl-label';
    lbl.innerHTML = labels[i] ? parseText(labels[i]) : ' ';
    grid.appendChild(lbl);
  });

  wrap.appendChild(grid);
  arabicArea.appendChild(wrap);

  requestAnimationFrame(() => {
    if (!grid.isConnected) return;
    const avail = (arabicArea.clientWidth ?? 0) - 48;
    const actual = grid.scrollWidth;
    if (actual > avail && avail > 0) {
      const sc = Math.max(0.65, avail / actual);
      grid.style.transform = `scale(${sc.toFixed(4)})`;
      grid.style.transformOrigin = 'center top';
    }
    requestAnimationFrame(() => {
      if (!grid.isConnected || !firstLetter || !line) return;
      const probe = document.createElement('span');
      probe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline;overflow:hidden;';
      firstLetter.appendChild(probe);
      const wrapRect  = wrap.getBoundingClientRect();
      const probeRect = probe.getBoundingClientRect();
      probe.remove();
      if (wrapRect.height > 0)
        line.style.top = (probeRect.bottom - wrapRect.top) + 'px';
    });
  });

  document.getElementById('text-area').innerHTML = '';
}

// ── renderWrite ────────────────────────────────────────
function renderWrite(s) {
  const d = s.data;
  const tokens = (d.arabic || '').trim().split(/\s+/).filter(Boolean);
  const noteText = d.note || d.transliteration || '';
  const labels = noteText
    ? noteText.trim().split(/\s+/).map(l => l.replace(/_/g, ' '))
    : [];

  const arabicArea = document.getElementById('arabic-area');
  arabicArea.innerHTML = '';

  const pairRow = document.createElement('div');
  pairRow.className = 'write-pair-row';
  pairRow.style.setProperty('--items', tokens.length || 1);

  tokens.forEach((ch, i) => {
    const pair = document.createElement('div');
    pair.className = 'write-pair';
    const letter = document.createElement('span');
    letter.className = 'write-arabic-letter';
    const token = document.createElement('span');
    token.className = 'write-token';
    token.textContent = ch;
    letter.appendChild(token);
    pair.appendChild(letter);
    if (labels[i]) {
      const label = document.createElement('span');
      label.className = 'write-pair-label';
      label.textContent = labels[i];
      pair.appendChild(label);
    }
    pairRow.appendChild(pair);
    const charCount = Array.from(ch).length;
    const wipeDuration = 0.5 + charCount * 0.5;
    setTimeout(() => {
      if (!token.isConnected) return;
      token.style.transition = `clip-path ${wipeDuration}s linear`;
      requestAnimationFrame(() => { token.style.clipPath = 'inset(-40% 0% -40% 0%)'; });
    }, 400 + i * (wipeDuration * 1000 + 600));
  });

  arabicArea.appendChild(pairRow);

  requestAnimationFrame(() => {
    if (!pairRow.isConnected) return;
    const avail = (arabicArea.clientWidth ?? 0) - 48;
    const actual = pairRow.scrollWidth;
    if (actual > avail && avail > 0) {
      const sc = Math.max(0.6, avail / actual);
      pairRow.style.transform = `scale(${sc.toFixed(4)})`;
      pairRow.style.transformOrigin = 'center top';
    }
  });

  const op = meaningVisible ? '1' : '0';
  document.getElementById('text-area').innerHTML =
    `<div class="korean" style="opacity:${op}">${parseText(d.korean || '')}</div>`;
}

// ── renderDongol ───────────────────────────────────────
// dongol 모드: 동골체 정적 표시 (애니메이션 없음)
function renderDongol(s) {

    ? noteText.trim().split(/\s+/).map(l => l.replace(/_/g, ' '))

    : [];

    pair.appendChild(letter);

// ── fitArabicText ──────────────────────────────────────
// 아랍어 텍스트가 컨테이너 너비를 초과하면 글자 크기를 줄여 한 줄에 맞춤
function fitArabicText(el) {
  requestAnimationFrame(() => {
    if (!el || !el.isConnected) return;
    const container = el.closest('#arabic-area') || el.parentElement;
    const containerW = container ? container.clientWidth - 48 : el.clientWidth;
    if (!containerW) return;
    // 현재 폰트 크기
    const fs = parseFloat(window.getComputedStyle(el).fontSize);
    // 한 줄로 펼쳤을 때 너비 측정
    const origWS = el.style.whiteSpace;
    el.style.whiteSpace = 'nowrap';
    const scrollW = el.scrollWidth;
    el.style.whiteSpace = origWS;
    if (scrollW <= containerW) return; // 이미 한 줄에 들어감
    const ratio = containerW / scrollW;
    const newFs = Math.max(Math.floor(fs * ratio * 0.97), 18);
    el.style.fontSize = newFs + 'px';
  });
}

// ── renderSentence ─────────────────────────────────────
function renderSentence(s) {
  const d = s.data;
  const arOp = arabicVisible ? '1' : '0';
  const unitPrefix = (d.id_datasheet || '').charAt(0).toUpperCase();
  const arClass = unitPrefix === 'A' ? 'sentence-ar sentence-a' : 'sentence-ar';
  const nom = isNomRow(d);
  const wrap = h => nom ? applyNomDivider(h) : h;
  document.getElementById('arabic-area').innerHTML =
    `<div class="${arClass}" style="opacity:${arOp};transition:opacity 0.3s;">${wrap(parseText(d.arabic || ''))}</div>`;
  fitArabicText(document.querySelector('#arabic-area .sentence-ar'));

  const op = meaningVisible ? '1' : '0';
  const desc = d.script || d.note || '';
  document.getElementById('text-area').innerHTML =
    (d.korean ? `<div class="sentence-kr" style="opacity:${op}">${wrap(parseText(d.korean))}</div>` : '') +
    (desc ? `<div class="sum-body" style="opacity:${op}">${renderSumDesc(desc)}</div>` : '');
}

// ── renderSvo ──────────────────────────────────────────
function renderSvo(s) {
  const d = s.data;
  const arTokens = (d.arabic || '').trim().split(/\s+/);
  const krLines  = (d.korean || '').split(/\r?\n/);
  const labels   = (krLines[0] || '').trim().split(/\s+/);
  const translation = krLines.slice(1).join(' ').trim();

  const arOp = arabicVisible ? '1' : '0';
  const arabicArea = document.getElementById('arabic-area');
  arabicArea.innerHTML = '';
  arabicArea.style.cssText = `opacity:${arOp};transition:opacity 0.3s;`;

  const row = document.createElement('div');
  row.className = 'svo-row';
  arTokens.forEach((token, i) => {
    const cell = document.createElement('div');
    cell.className = 'svo-cell';
    const ar = document.createElement('span');
    ar.className = 'svo-ar';
    ar.innerHTML = parseText(token);
    cell.appendChild(ar);
    const lblText = (labels[i] || '').trim();
    if (lblText && lblText !== '-' && lblText !== '_') {
      const lbl = document.createElement('span');
      lbl.className = 'svo-lbl';
      lbl.textContent = lblText;
      cell.appendChild(lbl);
    }
    row.appendChild(cell);
  });
  arabicArea.appendChild(row);

  const op = meaningVisible ? '1' : '0';
  document.getElementById('text-area').innerHTML =
    translation ? `<div class="svo-translation" style="opacity:${op}">${parseText(translation)}</div>` : '';
}

// ── renderNormal ───────────────────────────────────────
function renderNormal(s) {
  const d = s.data;
  const arOp = arabicVisible ? '1' : '0';
  const unitU = getRowU(d);
  const unitPrefix = (unitU || d.id_datasheet || '').charAt(0).toUpperCase();
  const isDrill = s.type === 'drill';
  // 드릴도 래퍼토리/패턴과 동일하게 arabic-a + fitArabicText로 크기 맞춤
  const arClass = unitPrefix === 'A' ? 'arabic arabic-a' : 'arabic';
  const nom = isNomRow(d);
  const wrap = h => nom ? applyNomDivider(h) : h;
  document.getElementById('arabic-area').innerHTML =
    `<div class="${arClass}" style="opacity:${arOp};transition:opacity 0.3s;">${wrap(parseText(d.arabic || ''))}</div>`;
  fitArabicText(document.querySelector('#arabic-area .' + arClass.split(' ')[0]));

  const op = meaningVisible ? '1' : '0';
  const noteText = d.note || d.transliteration || '';
  document.getElementById('text-area').innerHTML =
    `<div class="korean" style="opacity:${op}">${wrap(parseText(d.korean || ''))}</div>` +
    (noteText ? `<div class="note" style="opacity:${op}">${parseText(noteText)}</div>` : '');
}

// ── renderRepertoryGrid ────────────────────────────────
// | 구분 래퍼토리: 다열 그리드 — 아랍어 / 한국어 / 음가 모두 같은 그리드 안에
// 아랍어에 \n이 있으면 멀티행(줄바꿈 → CSS 그리드 행, | → 열)
function renderRepertoryGrid(s) {
  const d = s.data;
  const arOp = arabicVisible ? '1' : '0';
  const koOp = meaningVisible ? '1' : '0';

  // \n → 행, | → 열로 파싱
  const splitLines = src => (src || '').split('\n')
    .map(line => line.split('|').map(t => t.trim()).filter(Boolean))
    .filter(cells => cells.length > 0);

  const arRows = splitLines(d.arabic);
  const koRows = splitLines(d.korean);
  const noRows = splitLines(d.note);
  const cols = Math.max(...arRows.map(r => r.length), ...koRows.map(r => r.length), 1);
  const isMultiRow = arRows.length > 1;

  const arabicArea = document.getElementById('arabic-area');
  arabicArea.innerHTML = '';
  arabicArea.style.cssText = '';

  const grid = document.createElement('div');
  grid.className = 'rep-grid' + (isMultiRow ? ' rep-grid--multirow' : '');
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  // 아랍어 행(들) — \n 있으면 복수 행 렌더
  arRows.forEach(row => {
    row.forEach(t => {
      const cell = document.createElement('div');
      cell.className = 'rep-grid-ar';
      cell.style.opacity = arOp;
      cell.style.transition = 'opacity 0.3s';
      cell.innerHTML = parseText(t);
      grid.appendChild(cell);
    });
  });

  // 한국어 행(들) — 의미 토글 적용
  koRows.forEach(row => {
    row.forEach(t => {
      const cell = document.createElement('div');
      cell.className = 'rep-grid-ko rep-grid-meaning';
      cell.style.opacity = koOp;
      cell.style.transition = 'opacity 0.3s';
      cell.innerHTML = parseText(t);
      grid.appendChild(cell);
    });
  });

  // 음가(note) 행(들) — 항상 표시
  noRows.forEach(row => {
    row.forEach(t => {
      const cell = document.createElement('div');
      cell.className = 'rep-grid-note';
      cell.textContent = t;
      grid.appendChild(cell);
    });
  });

  arabicArea.appendChild(grid);
  document.getElementById('text-area').innerHTML = '';

  // 오버플로 시 scale 축소
  requestAnimationFrame(() => {
    if (!grid.isConnected) return;
    const avail = (arabicArea.clientWidth ?? 0) - 48;
    const actual = grid.scrollWidth;
    if (actual > avail && avail > 0) {
      const sc = Math.max(0.6, avail / actual);
      grid.style.transform = `scale(${sc.toFixed(4)})`;
      grid.style.transformOrigin = 'center top';
    }
  });
}

// ── renderNass ─────────────────────────────────────────
function renderNass(s) {
  const d = s.data;
  const sual = d.sual || '';
  const showArabic = nassTextVisible || !sual;
  const nom = isNomRow(d);
  const wrap = h => nom ? applyNomDivider(h) : h;

  const nassTextHtml = `
    <div class="nass-arabic-wrap">
      <div class="arabic" dir="rtl">${wrap(parseText(d.arabic || ''))}</div>
    </div>`;

  document.getElementById('arabic-area').innerHTML =
    showArabic ? (nassTextHtml + `<div class="nass-prompt"></div>`) : `<div class="nass-prompt"></div>`;

  const op = meaningVisible ? '1' : '0';
  document.getElementById('text-area').innerHTML =
    (d.korean ? `<div class="nass-korean-hint" style="opacity:${op}">${wrap(parseText(d.korean))}</div>` : '') +
    (d.note   ? `<div class="nass-note" style="opacity:${op}">${parseText(d.note)}</div>` : '') +
    (sual     ? `<div class="nass-sual-note">${parseText(sual)}</div>` : '');
}

// ── 설명 텍스트 렌더 헬퍼 ──────────────────────────────
function renderSumDesc(desc) {
  const lines = desc.split('\n');
  let html = '';
  let paraLines = [];
  const flushPara = () => {
    const text = paraLines.join('\n').trim();
    if (text) html += `<p class="sum-prose">${parseText(text)}</p>`;
    paraLines = [];
  };
  for (const line of lines) {
    const t = line.trim();
    if (t.startsWith('- ')) {
      flushPara();
      html += `<div class="sum-bullet"><span class="sum-bullet-dot">•</span><span>${parseText(t.slice(2))}</span></div>`;
    } else {
      paraLines.push(line);
    }
  }
  flushPara();
  return html;
}

// ── 섹션 탭 ────────────────────────────────────────────
const SEC_FIXED = [
  { key:'pattern',    ko:'패턴',    en:'Pattern'    },
  { key:'repertorie', ko:'래퍼토리', en:'Repertoire' },
  { key:'drill',      ko:'드릴',    en:'Drill'      },
  { key:'exp',        ko:'표현',    en:'Expression' },
  { key:'nass',       ko:'나스',    en:'Nass'       },
];

function buildSectionTabs() {
  const container = document.getElementById('section-tabs');
  if (!container) return;
  container.innerHTML = '';
  const curPg = slides[current]?.pg;

  // 동적: 서머리 슬라이드 하나씩 탭으로
  slides.forEach((s, idx) => {
    if (s.pg !== curPg || s.type !== 'summary') return;
    const ko = (s.data.korean || s.data.arabic || '').substring(0, 14);
    const btn = document.createElement('button');
    btn.className = 'sec-tab';
    btn.dataset.key = 'summary_' + idx;
    btn.onclick = () => goTo(idx);
    btn.innerHTML = `요약<small>${ko}</small>`;
    container.appendChild(btn);
  });

  // 고정 탭
  SEC_FIXED.forEach(sec => {
    const firstIdx = slides.findIndex(s => s.pg === curPg && s.type === sec.key);
    const btn = document.createElement('button');
    btn.className = 'sec-tab' + (firstIdx === -1 ? ' disabled' : '');
    btn.dataset.key = sec.key;
    if (firstIdx !== -1) btn.onclick = () => goTo(firstIdx);
    btn.innerHTML = `${sec.ko}<small>${sec.en}</small>`;
    container.appendChild(btn);
  });

  updateSectionTabs();
}

function updateSectionTabs() {
  const container = document.getElementById('section-tabs');
  if (!container) return;
  const curType = slides[current]?.type;
  const activeSummaryKey = curType === 'summary' ? 'summary_' + current : null;

  container.querySelectorAll('.sec-tab').forEach(btn => {
    const k = btn.dataset.key;
    let isActive = false;
    if (activeSummaryKey && k === activeSummaryKey) isActive = true;
    else if (!activeSummaryKey && k === curType) isActive = true;
    btn.classList.toggle('active', isActive);
  });
}

// ── 인덱스 ────────────────────────────────────────────
function buildIndex() {
  const list = document.getElementById('index-list');
  list.innerHTML = '';

  const dsRaw = _cache[TAB_DS] || [];
  const nassRaw = _cache['gid:' + GID_NASS] || [];
  const seen = new Set();
  const units = [];

  // 1) 데이터시트에서 유닛 탐지 (summary 또는 pattern 타입 기준)
  dsRaw.forEach(r => {
    const nt = normalizeType(r.type);
    if (nt !== 'summary' && nt !== 'pattern') return;
    if (!hasSlideContent(r)) return;
    const s = (r.status || '').toLowerCase();
    if (s !== '' && s !== 'confirmed') return;
    const u = getBaseUnit(getRowU(r));
    if (!u || u === '#REF!' || seen.has(u)) return;
    seen.add(u);
    units.push({ u, arabic: r.arabic || '', korean: r.korean || '' });
  });

  // 2) 나스 탭에서 유닛 탐지 — 데이터시트에 없는 유닛 보완
  nassRaw.forEach(r => {
    if (normalizeType(r.type) !== 'nass') return;
    if (!hasSlideContent(r)) return;
    const s = (r.status || '').toLowerCase();
    if (s !== '' && s !== 'confirmed') return;
    const nassId = (r.id_nass || '');
    const u = nassId.split('-')[0].toUpperCase();
    if (!u || seen.has(u)) return;
    seen.add(u);
    units.push({ u, arabic: r.arabic?.split('\n')[0] || '', korean: r.korean?.split('\n')[0] || '' });
  });

  // 3) 순서 정렬: P01-P10, A01-A25
  const ORDER = [
    'P01','P02','P03','P04','P05','P06','P07','P08','P09','P10',
    'A01','A02','A03','A04','A05','A06','A07','A08','A09','A10',
    'A11','A12','A13','A14','A15','A16','A17','A18','A19','A20',
    'A21','A22','A23','A24','A25'
  ];
  units.sort((a, b) => {
    const ai = ORDER.indexOf(a.u), bi = ORDER.indexOf(b.u);
    if (ai !== -1 && bi !== -1) return ai - bi;
    if (ai !== -1) return -1;
    if (bi !== -1) return 1;
    return a.u.localeCompare(b.u);
  });

  units.forEach(({ u, arabic, korean }) => {
    const li = document.createElement('li');
    li.className = 'idx-item';
    li.dataset.u = u;
    li.innerHTML =
      `<span class="idx-tag">${u}</span>` +
      `<span class="idx-info">` +
        `<span class="idx-ar">${arabic.substring(0, 28)}</span>` +
        `<span class="idx-ko">${korean.substring(0, 26)}</span>` +
      `</span>`;
    list.appendChild(li);
  });
}

function updateIndex() {
  const curU = slides[current]?.pg || '';
  document.querySelectorAll('.idx-item').forEach(el => {
    el.classList.toggle('active', el.dataset.u === curU);
  });
  const active = document.querySelector('.idx-item.active');
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ── 토글 함수 ──────────────────────────────────────────
function toggleMeaning() {
  meaningVisible = !meaningVisible;
  document.getElementById('btn-meaning').classList.toggle('active', !meaningVisible);
  const s = slides[current];
  if (!s) return;
  const op = meaningVisible ? '1' : '0';
  if (s.type === 'nass') {
    renderNass(s);
    appendLahjaBlock(s);  // 라하 깃발 재부착
  } else {
    document.querySelectorAll('#text-area .korean, #text-area .note, #text-area .sentence-kr, #text-area .svo-translation, #text-area .nass-korean-hint').forEach(el => {
      el.style.opacity = op;
    });
    // text-area의 sum-body (sentence/svo 설명)
    document.querySelectorAll('#text-area .sum-body').forEach(el => {
      el.style.opacity = op;
    });
    // 래퍼토리 그리드 한국어 셀 (arabic-area 안에 있음)
    document.querySelectorAll('#arabic-area .rep-grid-meaning').forEach(el => {
      el.style.opacity = op;
    });
  }
}

function toggleArabic() {
  arabicVisible = !arabicVisible;
  document.getElementById('btn-arabic').classList.toggle('active', !arabicVisible);
  const el = document.querySelector('#arabic-area .arabic, #arabic-area .sentence-ar, #arabic-area .svo-row');
  if (el) {
    el.style.opacity = arabicVisible ? '1' : '0';
  } else {
    // baseline/write modes: opacity on arabic-area itself
    const aa = document.getElementById('arabic-area');
    if (aa) aa.style.opacity = arabicVisible ? '1' : '0';
  }
}

function toggleNass() {
  nassTextVisible = !nassTextVisible;
  document.getElementById('btn-nass').classList.toggle('active', nassTextVisible);
  const s = slides[current];
  if (s?.type === 'nass') {
    renderNass(s);
    appendLahjaBlock(s);  // 라하 깃발 재부착
  }
}

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('open', sidebarOpen);
  document.getElementById('btn-menu').classList.toggle('active', sidebarOpen);
}

// ── 오디오 ────────────────────────────────────────────
function encodeAudioPart(v) {
  return encodeURIComponent(String(v).normalize('NFD')).replace(/%2C/gi, ',');
}

function getAudioUrls(s) {
  if (!s || !isAudioSlide(s)) return [];
  const d = s.data;
  if (d?.url) return [d.url.trim()];
  const id = getRowId(d);
  if (!id) return [];
  // 버킷 구조: listening/{id}.mp3 (unit 서브폴더 없음)
  const base = `${AUDIO_BASE}/${AUDIO_FOLDER}/${encodeAudioPart(id)}`;
  return AUDIO_EXTS.map(ext => base + ext);
}

function toggleAudio() {
  const audio = document.getElementById('slide-audio');
  const s = slides[current];
  const urls = getAudioUrls(s);
  const btn = document.getElementById('btn-audio');
  if (audioPlaying) {
    audio.pause(); audio.currentTime = 0;
    audioPlaying = false;
    btn.classList.remove('active');
  } else if (urls.length) {
    const onEnd = () => { audioPlaying = false; btn.classList.remove('active'); };
    const tryPlay = (i) => {
      if (i >= urls.length) { onEnd(); return; }
      let fired = false;
      const advance = () => { if (!fired) { fired = true; tryPlay(i + 1); } };
      audio.onended = onEnd;
      audio.onerror = advance;
      audio.src = urls[i];
      audio.load();
      audio.play().catch(advance);
    };
    tryPlay(0);
    audioPlaying = true;
    btn.classList.add('active');
  }
}

// ── 내비게이션 ────────────────────────────────────────
function goTo(n) {
  if (!slides.length) return;
  const audio = document.getElementById('slide-audio');
  if (audioPlaying) {
    audio.pause(); audio.currentTime = 0;
    audioPlaying = false;
    document.getElementById('btn-audio').classList.remove('active');
  }
  current = Math.max(0, Math.min(slides.length - 1, n));
  const sp = new URLSearchParams(location.search);
  sp.set('slide', current);
  history.replaceState(null, '', '?' + sp.toString());
  nassTextVisible = false;
  renderSlide();
}

// ── 키보드 ────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch(e.key) {
    case 'ArrowRight': case 'ArrowDown': e.preventDefault(); goTo(current + 1); break;
    case 'ArrowLeft':  case 'ArrowUp':   e.preventDefault(); goTo(current - 1); break;
    case ' ':          e.preventDefault(); toggleMeaning(); break;
    case 'a': case 'A': toggleArabic(); break;
    case 'm': case 'M': toggleSidebar(); break;
    case 't': case 'T': if (slides[current]?.type === 'nass') toggleNass(); break;
    case 's': case 'S': toggleAudio(); break;
    case 'Escape': if (sidebarOpen) toggleSidebar(); break;
    case 'End':  e.preventDefault(); goTo(slides.length - 1); break;
    case 'Home': e.preventDefault(); goTo(0); break;
  }
});

// ── 터치 스와이프 ─────────────────────────────────────
(function() {
  let startX = 0, startY = 0;
  const main = document.getElementById('main');
  main.addEventListener('touchstart', e => {
    startX = e.changedTouches[0].clientX;
    startY = e.changedTouches[0].clientY;
  }, { passive: true });
  main.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      dx < 0 ? goTo(current + 1) : goTo(current - 1);
    }
  }, { passive: true });
})();

// ── 버튼 이벤트 ───────────────────────────────────────
document.getElementById('btn-menu').onclick    = toggleSidebar;
document.getElementById('btn-audio').onclick   = toggleAudio;
document.getElementById('btn-meaning').onclick = toggleMeaning;
document.getElementById('btn-arabic').onclick  = toggleArabic;
document.getElementById('btn-nass').onclick    = toggleNass;

// ── 사이드바 클릭 — 이벤트 위임 ─────────────────────
document.addEventListener('click', e => {
  const item = e.target.closest('#index-list .idx-item');
  if (!item || !item.dataset.u) return;
  buildSlides(item.dataset.u).catch(err => console.error(err));
  if (sidebarOpen) toggleSidebar();
});

// ── 초기화 ────────────────────────────────────────────
async function init() {
  try {
    await Promise.all([
      fetchSheet(TAB_DS),
      fetchOptionalSheet(GID_NASS, true),
    ]);

    const dsRaw = _cache[TAB_DS] || [];
    buildUnitMaps(dsRaw); // i열 기반 유닛 맵 초기화
    // 유닛 목록: datasheet + nass 탭 기준
    const seen = new Set();
    const baseUnits = [];
    const nassRaw = _cache['gid:' + GID_NASS] || [];
    dsRaw.forEach(r => {
      const nt = normalizeType(r.type);
      if (nt !== 'summary' && nt !== 'pattern') return;
      if (!hasSlideContent(r)) return;
      const s = (r.status || '').toLowerCase();
      if (s !== '' && s !== 'confirmed') return;
      const u = getBaseUnit(getRowU(r));
      if (u && u !== '#REF!' && !seen.has(u)) { seen.add(u); baseUnits.push(u); }
    });
    nassRaw.forEach(r => {
      if (normalizeType(r.type) !== 'nass') return;
      if (!hasSlideContent(r)) return;
      const s = (r.status || '').toLowerCase();
      if (s !== '' && s !== 'confirmed') return;
      const u = (r.id_nass || '').split('-')[0].toUpperCase();
      if (u && !seen.has(u)) { seen.add(u); baseUnits.push(u); }
    });
    const ORDER = ['P01','P02','P03','P04','P05','P06','P07','P08','P09','P10','A01','A02','A03','A04','A05','A06','A07','A08','A09','A10','A11','A12','A13','A14','A15','A16','A17','A18','A19','A20','A21','A22','A23','A24','A25'];
    baseUnits.sort((a,b) => { const ai=ORDER.indexOf(a), bi=ORDER.indexOf(b); return (ai===-1?999:ai)-(bi===-1?999:bi); });

    const params = new URLSearchParams(location.search);
    const savedPg = params.get('unit');
    const startPg = (savedPg && baseUnits.includes(savedPg)) ? savedPg : (baseUnits[0] || 'A01');

    await buildSlides(startPg);
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<div style="color:#fff;font-size:1rem;">로딩 실패: ${e.message}</div>`;
    console.error(e);
    return;
  }
  document.getElementById('loading').style.display = 'none';
}

init();
